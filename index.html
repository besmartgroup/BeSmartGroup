<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BeSmartGroup | Connect. Follow. BeSmart.</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #050505;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .logo {
      width: 95px;
      height: 95px;
      border: 2px solid #d4af37;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 22px;
      color: #d4af37;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    h1 {
      color: #d4af37;
      font-size: 30px;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .tagline {
      color: #ffffff;
      font-size: 16px;
      margin-bottom: 30px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 16px 20px;
      margin: 14px 0;
      border: 1px solid #d4af37;
      border-radius: 12px;
      text-decoration: none;
      color: #ffffff;
      background: #111111;
      font-size: 16px;
      font-weight: bold;
      transition: 0.2s ease;
    }

    .button:hover {
      background: #d4af37;
      color: #050505;
      transform: translateY(-2px);
    }

    .footer {
      margin-top: 30px;
      color: #777777;
      font-size: 13px;
    }

    .gold {
      color: #d4af37;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      BSG
    </div>

    <h1>BeSmartGroup</h1>

    <p class="tagline">
      Connect. Follow. <span class="gold">BeSmart.</span>
    </p>

    <a class="button"
       href="https://wa.me/447438764865"
       target="_blank">
      WhatsApp
    </a>

    <a class="button"
       href="https://www.instagram.com/besmartgroup/"
       target="_blank">
      Instagram
    </a>

    <a class="button"
       href="https://www.facebook.com/profile.php?id=61593775508438"
       target="_blank">
      Facebook
    </a>

    <a class="button"
       href="https://www.linkedin.com/company/besmartgroup"
       target="_blank">
      LinkedIn
    </a>

    <div class="footer">
      © 2026 <span class="gold">BeSmartGroup</span>
    </div>

  </div>

</body>
</html>
