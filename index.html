<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BeSmartGroup | Connect. Follow. BeSmart.</title>
  <meta name="description" content="Connect. Follow. BeSmart. Visit the official BeSmartGroup website and connect with us on social media.">
  <meta name="theme-color" content="#050505">

  <link rel="canonical" href="https://besmartgroup.net/">

  <!-- Social media icons -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #050505;
      color: #111111;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px 18px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      text-align: center;
    }

    /* Original BeSmartGroup logo */
    .logo {
      width: 100%;
      max-width: 430px;
      height: auto;
      display: block;
      margin: 0 auto 24px;
      border-radius: 12px;
    }

    /* Tagline */
    .tagline {
      color: #ffffff;
      font-size: 17px;
      margin-bottom: 30px;
      letter-spacing: 0.2px;
    }

    .gold {
      color: #d4af37;
      font-weight: 700;
    }

    /* Website and social media buttons */
    .social-button {
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 64px;
      margin: 14px 0;
      padding: 0 20px;
      background: #ffffff;
      color: #111111;
      border: 2px solid #d4af37;
      border-radius: 14px;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.35);
      transition: transform 0.2s ease,
                  box-shadow 0.2s ease;
    }

    .social-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(212, 175, 55, 0.25);
    }

    .social-button:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: 4px;
    }

    /* Icons */
    .social-icon {
      width: 48px;
      flex-shrink: 0;
      font-size: 28px;
      text-align: center;
      margin-right: 12px;
    }

    .website {
      color: #d4af37;
    }

    .whatsapp {
      color: #25D366;
    }

    .instagram {
      color: #E4405F;
    }

    .facebook {
      color: #1877F2;
    }

    .linkedin {
      color: #0A66C2;
    }

    .social-name {
      flex: 1;
      text-align: left;
    }

    .arrow {
      color: #777777;
      font-size: 14px;
      margin-left: 8px;
    }

    /* Footer */
    .footer {
      margin-top: 30px;
      color: #777777;
      font-size: 12px;
      line-height: 1.8;
    }

    .footer span {
      color: #d4af37;
    }

    .footer a {
      color: #d4af37;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    /* Mobile */
    @media (max-width: 480px) {
      body {
        padding: 25px 16px;
      }

      .logo {
        max-width: 100%;
        margin-bottom: 22px;
      }

      .tagline {
        font-size: 15px;
        margin-bottom: 28px;
      }

      .social-button {
        min-height: 62px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .social-button {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- Original BeSmartGroup logo -->
    <img
      src="besmartgroup-logo.jpeg.JPG"
      alt="BeSmartGroup logo"
      class="logo"
    >

    <!-- Tagline -->
    <p class="tagline">
      Connect. Follow. <span class="gold">BeSmart.</span>
    </p>

    <!-- Official website -->
    <a
      class="social-button"
      href="https://besmartgroup.net/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Visit the official BeSmartGroup website"
    >
      <div class="social-icon website">
        <i class="fa-solid fa-globe"></i>
      </div>

      <div class="social-name">
        Visit Our Website
      </div>

      <div class="arrow">
        <i class="fa-solid fa-arrow-up-right-from-square"></i>
      </div>
    </a>

    <!-- WhatsApp -->
    <a
      class="social-button"
      href="https://wa.me/447438764865"
      target="_blank"
      rel="noopener noreferrer"
    >
      <div class="social-icon whatsapp">
        <i class="fa-brands fa-whatsapp"></i>
      </div>

      <div class="social-name">
        WhatsApp
      </div>

      <div class="arrow">
        <i class="fa-solid fa-arrow-up-right-from-square"></i>
      </div>
    </a>

    <!-- Instagram -->
    <a
      class="social-button"
      href="https://www.instagram.com/besmartgroup/"
      target="_blank"
      rel="noopener noreferrer"
    >
      <div class="social-icon instagram">
        <i class="fa-brands fa-instagram"></i>
      </div>

      <div class="social-name">
        Instagram
      </div>

      <div class="arrow">
        <i class="fa-solid fa-arrow-up-right-from-square"></i>
      </div>
    </a>

    <!-- Facebook -->
    <a
      class="social-button"
      href="https://www.facebook.com/profile.php?id=61593775508438"
      target="_blank"
      rel="noopener noreferrer"
    >
      <div class="social-icon facebook">
        <i class="fa-brands fa-facebook-f"></i>
      </div>

      <div class="social-name">
        Facebook
      </div>

      <div class="arrow">
        <i class="fa-solid fa-arrow-up-right-from-square"></i>
      </div>
    </a>

    <!-- LinkedIn -->
    <a
      class="social-button"
      href="https://www.linkedin.com/company/besmartgroup"
      target="_blank"
      rel="noopener noreferrer"
    >
      <div class="social-icon linkedin">
        <i class="fa-brands fa-linkedin-in"></i>
      </div>

      <div class="social-name">
        LinkedIn
      </div>

      <div class="arrow">
        <i class="fa-solid fa-arrow-up-right-from-square"></i>
      </div>
    </a>

    <!-- Footer -->
    <div class="footer">
      © 2026 <span>BeSmartGroup</span>
      <br>
      <a href="https://besmartgroup.net/"
         target="_blank"
         rel="noopener noreferrer">
        besmartgroup.net
      </a>
    </div>

  </main>

</body>
</html>
